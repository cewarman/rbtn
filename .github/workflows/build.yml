name: Build and Publish


on:
  push:
    tags:
      - "v*"


jobs:

  build:

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest


    runs-on: ${{ matrix.os }}


    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5


      - name: Install
        run: |
          pip install cibuildwheel


      - name: Build wheels
        env:
          CIBW_BUILD_VERBOSITY: 3
          CIBW_BUILD_FRONTEND: build
        run: |
          cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{matrix.os}}
          path: wheelhouse/*
          
      - name: Show project files
        run: |
          find . -name "*.so" || true
          find . -name "*.dll" || true
          find . -name "*.dylib" || true
      - name: Debug setup
        shell: bash
        run: |
          ls -R
          cat setup.py
          cat pyproject.toml
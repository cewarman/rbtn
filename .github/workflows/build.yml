name: Build and Publish


on:
  push:
    tags:
      - "v*"


jobs:

  build:

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest


    runs-on: ${{ matrix.os }}


    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5


      - name: Install
        run: |
          pip install cibuildwheel


      - name: Build wheels
        run: |
          cibuildwheel --output-dir wheelhouse


      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{matrix.os}}
          path: wheelhouse/*

name: Build wheels

on:
  push:
    branches:
      - main

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_BEFORE_BUILD_LINUX: >
            gcc -shared -fPIC -O3
            C/RBTN.c C/TNlib.c
            -o src/rbtn/pypiRBTN.so &&
            file src/rbtn/pypiRBTN.so

          CIBW_BEFORE_BUILD_WINDOWS: >
            call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat" &&
            where cl &&
            cl /LD /O2 C\RBTN.c C\TNlib.c /Fe:src\rbtn\pypiRBTN.dll &&
            dir src\rbtn\pypiRBTN.dll

          CIBW_BEFORE_BUILD_MACOS: >
            clang -shared -O3
            C/RBTN.c C/TNlib.c
            -o src/rbtn/pypiRBTN.dylib 

        with:
          output-dir: wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
      name: Publish to PyPI
      needs: build_wheels
      runs-on: ubuntu-latest

      environment:
        name: pypi
        url: https://pypi.org/p/rbtn

      permissions:
        id-token: write

      steps:
        - name: Download wheels
          uses: actions/download-artifact@v4
          with:
            pattern: wheels-*
            path: dist
            merge-multiple: true

        - name: Publish to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1